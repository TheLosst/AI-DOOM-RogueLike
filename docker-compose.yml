services:
  ai-doom:
    image: nginx:alpine
    container_name: ai-doom
    restart: unless-stopped
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: YOUR_NETWORK_NAME  # замени на имя своей сети в Docker
