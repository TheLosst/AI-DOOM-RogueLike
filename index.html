<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Engine</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hud">
      <div class="hud-topleft">
        <span id="fps" class="hud-fps">-- FPS</span>
        <label class="hud-scale">
          <span>SCALE <b id="scaleValue">0.60</b></span>
          <input id="scaleSlider" type="range" min="0.4" max="1" step="0.05" value="0.6" />
        </label>
      </div>

      <div class="hud-topright">
        <span id="level">LVL 1</span>
        <span class="hud-dot">·</span>
        <span id="floor">FLOOR 1</span>
      </div>

      <div class="hud-botleft">
        <div class="hud-health">
          <span class="hud-heart">♥</span>
          <div class="hud-bar">
            <div id="healthBar" class="hud-bar-fill"></div>
          </div>
          <span id="hp" class="hud-hp">100</span>
        </div>
        <div id="kills" class="hud-kills">0 KILLS</div>
      </div>

      <div class="hud-botcenter">
        <div class="hud-score-label">SCORE</div>
        <div id="score" class="hud-score-num">0</div>
      </div>

      <div class="hud-botright">
        <canvas id="minimap" width="250" height="250"></canvas>
      </div>
    </div>
    <div id="notice" class="notice" hidden>
      <div class="notice-title">YOU DIED</div>
      <div class="notice-score">Your score: <span id="finalScore">0</span></div>
      <div class="notice-score">High score: <span id="highScore">0</span></div>
      <div class="notice-hint">PRESS R</div>
      <div class="notice-menu">M — МЕНЮ</div>
    </div>
    <div id="menu">
      <div class="menu-scanlines"></div>
      <div class="menu-inner">
        <p class="menu-eye">ROGUELIKE · ПЕРВОЕ ЛИЦО</p>
        <h1 class="menu-title">3D ENGINE</h1>
        <div class="menu-rule"></div>
        <button id="menuStart" class="menu-btn">НАЧАТЬ ИГРУ</button>
        <p class="menu-rec">РЕКОРД &nbsp;<span id="menuHiScore">—</span></p>
        <p class="menu-enter">ENTER</p>
      </div>
    </div>
    <canvas id="view"></canvas>
    <script src="script.js"></script>
  </body>
</html>
